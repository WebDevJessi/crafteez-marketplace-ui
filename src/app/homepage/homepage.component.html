<div [style.background]="currentBackground" class="bg-link">
  <p class="banner" style="padding-top: 0px;top: 68px;margin-top: 0px;">Unleash Your Creativity</p>
  <igx-carousel indicatorsOrientation="bottom">
    <igx-slide *ngFor="let slide of slides">
      <div class="image-container">
        <img *ngIf="slide.type === 'image'" [src]="slide.src" [alt]="appTitle" />
        <video
          *ngIf="slide.type === 'video'"
          [src]="slide.src"
          autoplay
          muted
          loop
          playsinline
        ></video>
      </div>
    </igx-slide>
  </igx-carousel>
  <p>{{appTitle}}</p>
  <p>{{subTitle}}</p>
</div>
